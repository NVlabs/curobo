name: PR commit signing reminder

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-commit-signing-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # Read only GitHub API data; never check out or run code from the PR.
      - name: Check commit signatures and comment once
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number, per_page: 100,
            });
            if (commits.length === 0) {
              core.warning('No commits returned; skipping signing reminder.');
              return;
            }
            if (commits.every(({ commit }) => commit.verification?.verified === true)) {
              return;
            }

            const marker = '<!-- curobo-commit-signing-reminder -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            if (comments.some(({ user, body }) =>
              user?.login === 'github-actions[bot]' && body?.includes(marker))) {
              return;
            }

            const body = [
              marker,
              'Thanks for the contribution! Some commits in this PR do not have verified signatures. We require all commits to be signed before merging. Please follow our [contribution guidelines](https://github.com/NVlabs/curobo/blob/main/CONTRIBUTING.md).',
              '',
              'Once [commit signing is configured](https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits), run these commands from your PR branch:',
              '',
              '```bash',
              "git rebase --exec 'git commit --amend --no-edit -S' main",
              'git push --force-with-lease',
              '```',
              '',
              'This rewrites your branch history, so make a local backup first. Only sign commits you are authorized to sign. If GitHub shows an existing signature as unverified, check its verification details before rewriting it.',
              '',
              'To automatically sign future commits in this repository:',
              '',
              '```bash',
              'git config commit.gpgsign true',
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner, repo, issue_number: pull_number, body,
            });
